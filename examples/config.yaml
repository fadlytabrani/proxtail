# Multi-tailnet proxtail configuration example
# Convention over configuration:
#   - hostname defaults to "<system-hostname>-<profile>"
#   - auth_key defaults to "TS_AUTHKEY_<PROFILE>" (or "TS_AUTHKEY" for a single tailnet)
#   - ephemeral defaults to true
#   - auto_proxy_vips defaults to true (automatically discovers and proxies Tailscale VIP services into vip_port_range)
#   - protocol defaults to "tcp"
#   - destination port defaults to port if omitted (e.g., "web-server" -> "web-server:8080")
#   - timeout defaults to 30 seconds

tailnets:
  - profile: 'production'
    auto_proxy_vips: true # Enabled by default: dynamically binds discovered VIP services in vip_port_range
    ports:
      # Same port on proxy and target ("web-server" -> "web-server:8080", protocol defaults to tcp)
      - port: 8080
        destination: 'web-server'

      # Different target port with custom timeout
      - port: 8443
        destination: 'api-server:443'
        timeout: 45

      # UDP service (gaming, DNS, streaming, etc.)
      - port: 12345
        destination: 'game-server'
        protocol: 'udp'
        timeout: 10

  - profile: 'staging'
    # Optional per-tailnet bind IP override (allows multiple tailnets to bind identical local ports on distinct IPs)
    # listen_address: '127.0.0.2'
    ports:
      - port: 9080
        destination: 'staging-web:8080'

  - profile: 'development'
    auto_proxy_vips: false # Optional: disable automatic VIP service proxying for a specific tailnet
    ports:
      - port: 3000
        destination: 'dev-server'

# Optional proxy tuning & monitoring (omit entirely to use defaults: 512KB buffer, 200 workers)
proxy:
  # api_listen_address: '127.0.0.1' # Optional bind address for the HTTP API server (default: '0.0.0.0')
  api_port: 9090                    # Exposes /healthz and /metrics
  # state_dir: '/var/lib/tsnet'     # Optional base directory for Tailscale state (<state_dir>/<profile>)
  vip_port_range: '30000-30999' # Reserved local port range for auto-proxied VIP services (manual ports cannot overlap)

  # Active upstream reachability probing and local listener suspension (e.g. for F5 BIG-IP / ADC frontends)
  probe:
    enabled: true            # Enable active reachability probing (default: false)
    interval: 10             # Idle check interval in seconds (default: 10)
    timeout: 2               # Dial probe timeout in seconds (default: 2)
    consecutive_failures: 2  # Failures before suspending listener (default: 2; dial-failure is instant)
    cooldown: 10             # Skip probing if client traffic occurred in last 10s (default: 10)
    udp_probe_mode: 'payload' # 'payload' (default: 0-byte UDP packet + ICMP Port Unreachable detection) or 'netmap' (route/peer-online check only without sending UDP packets)

# Environment variables for this configuration:
#   TS_AUTHKEY_PRODUCTION=tskey-auth-xxxxx
#   TS_AUTHKEY_STAGING=tskey-auth-yyyyy
#   TS_AUTHKEY_DEVELOPMENT=tskey-auth-zzzzz
