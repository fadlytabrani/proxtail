name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Cross-compile release binaries and archives
        id: release-meta
        env:
          VERSION: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
            "freebsd/amd64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "${GOOS}" = "windows" ]; then
              EXT=".exe"
            fi
            BIN_NAME="proxtail-${VERSION}-${GOOS}-${GOARCH}${EXT}"
            OUTPUT="dist/${BIN_NAME}"
            echo "Building standalone executable ${OUTPUT}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.buildDate=${BUILD_DATE}" \
              -o "${OUTPUT}" ./cmd/proxtail

            # Provide unversioned standalone executable for latest stable download scripts
            if [ "${IS_PRERELEASE}" != "true" ]; then
              cp "${OUTPUT}" "dist/proxtail-${GOOS}-${GOARCH}${EXT}"
            fi

            # Package standalone archive with LICENSE and README
            STAGE_DIR="dist/stage_${GOOS}_${GOARCH}"
            mkdir -p "${STAGE_DIR}"
            cp "${OUTPUT}" "${STAGE_DIR}/proxtail${EXT}"
            cp LICENSE "${STAGE_DIR}/"
            cp README.md "${STAGE_DIR}/"

            if [ "${GOOS}" = "windows" ]; then
              (cd "${STAGE_DIR}" && zip -q -r "../../dist/proxtail-${VERSION}-${GOOS}-${GOARCH}.zip" .)
              if [ "${IS_PRERELEASE}" != "true" ]; then
                cp "dist/proxtail-${VERSION}-${GOOS}-${GOARCH}.zip" "dist/proxtail-${GOOS}-${GOARCH}.zip"
              fi
            else
              tar -czf "dist/proxtail-${VERSION}-${GOOS}-${GOARCH}.tar.gz" -C "${STAGE_DIR}" .
              if [ "${IS_PRERELEASE}" != "true" ]; then
                cp "dist/proxtail-${VERSION}-${GOOS}-${GOARCH}.tar.gz" "dist/proxtail-${GOOS}-${GOARCH}.tar.gz"
              fi
            fi
            rm -rf "${STAGE_DIR}"
          done

          cd dist
          sha256sum proxtail-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: proxtail ${{ github.ref_name }} (${{ steps.release-meta.outputs.build_date }})
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/proxtail-*
            dist/SHA256SUMS
